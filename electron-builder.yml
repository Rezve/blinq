appId: com.blinq.app
productName: Blinq
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: build/icon.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.healthcare-fitness
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
  maintainer: blinq
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Rezve
  repo: blinq
